<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225" role="img" font-family="ui-monospace, Menlo, Consolas, monospace">
<title>Embedded Systems cover</title>
<desc>Two timelines side by side. On the top one, a super-loop is stuck inside delay(2000) when the button is pressed, so the press is missed. On the bottom one, the same press triggers an interrupt service routine that runs immediately.</desc>
<rect class="f-bg s-line" x="0.5" y="0.5" width="399" height="224" rx="18" fill="#0b0d1c" stroke="#3b2f28"/>
<text class="f-muted" x="24" y="81" font-size="14" font-weight="700" text-anchor="start" fill="#d8c8b8">loop</text>
<text class="f-muted" x="24" y="153" font-size="14" font-weight="700" text-anchor="start" fill="#d8c8b8">ISR</text>
<rect class="f-surface s-dim" x="80" y="60" width="300" height="32" rx="6" fill="#181a2d" stroke="#9f948d" stroke-width="1.5"/>
<rect class="f-surface s-dim" x="80" y="132" width="300" height="32" rx="6" fill="#181a2d" stroke="#9f948d" stroke-width="1.5"/>
<rect class="f-err" x="96" y="66" width="230" height="20" rx="4" fill="#ff6f73" fill-opacity="0.25"/>
<text class="f-text" x="148" y="81" font-size="13" font-weight="400" text-anchor="middle" fill="#fff7ed">delay(2000)</text>
<path class="s-accent" d="M200 42V180" fill="none" stroke="#ffb15f" stroke-width="2" stroke-dasharray="4 4"/>
<text class="f-accent" x="200" y="34" font-size="13" font-weight="700" text-anchor="middle" fill="#ffb15f">press</text>
<path class="s-err" d="M190 97L210 117M210 97L190 117" fill="none" stroke="#ff6f73" stroke-width="3" />
<text class="f-err" x="218" y="122" font-size="12" font-weight="700" text-anchor="start" fill="#ff6f73">missed</text>
<rect class="f-ok" x="200" y="138" width="26" height="20" rx="4" fill="#69d19d"/>
<path class="s-dim" d="M80 196H380" fill="none" stroke="#9f948d" stroke-width="2" />
<path class="s-dim" d="M373 191L380 196L373 201" fill="none" stroke="#9f948d" stroke-width="2"/>
</svg>
