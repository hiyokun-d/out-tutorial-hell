<rect class="f-surface s-dim" x="74" y="98" width="34" height="34" rx="8" fill="#181a2d" stroke="#9f948d" stroke-width="2"/><text class="f-text" x="91.0" y="121.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff7ed">=</text>
<rect class="f-surface s-accent" x="116" y="98" width="34" height="34" rx="8" fill="#181a2d" stroke="#ffb15f" stroke-width="2"/><text class="f-text" x="133.0" y="121.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff7ed">a</text>
<rect class="f-surface s-dim" x="158" y="98" width="34" height="34" rx="8" fill="#181a2d" stroke="#9f948d" stroke-width="2"/><text class="f-text" x="175.0" y="121.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff7ed">+</text>
<rect class="f-surface s-ok" x="200" y="98" width="34" height="34" rx="8" fill="#181a2d" stroke="#69d19d" stroke-width="2"/><text class="f-text" x="217.0" y="121.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff7ed">1</text>
