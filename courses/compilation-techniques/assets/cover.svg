<circle class="f-surface s-dim" cx="312" cy="64" r="16" fill="#181a2d" stroke="#9f948d" stroke-width="2"/>
<text class="f-text" x="312" y="70" font-size="16" font-weight="700" text-anchor="middle" fill="#fff7ed">=</text>
