<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225" role="img" font-family="ui-monospace, Menlo, Consolas, monospace">
<title>Compilation Techniques cover</title>
<desc>The source line x = a + 1 is split by the lexer into five tokens: identifier x, equals, identifier a, plus, and the number 1. The parser then arranges those tokens into a tree with = at the root, x as its left child, and a + node holding a and 1 as its right child.</desc>
<rect class="f-bg s-line" x="0.5" y="0.5" width="399" height="224" rx="18" fill="#0b0d1c" stroke="#3b2f28"/>
<text class="f-muted" x="32" y="52" font-size="20" font-weight="400" text-anchor="start" fill="#d8c8b8">x = a + 1</text>
