<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225" role="img" aria-label="Test results with three passing and one failing, beside a 75 percent coverage donut">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1c"/>
      <stop offset="1" stop-color="#181a2d"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="224" rx="18" fill="url(#bg)" stroke="#ffb15f" stroke-opacity="0.18"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="28" y="34" font-size="9" fill="#9f948d" letter-spacing="1">TEST RUN</text>

    <!-- pass rows -->
    <g>
      <rect x="28" y="44" width="212" height="30" rx="9" fill="#69d19d" fill-opacity="0.07" stroke="#69d19d" stroke-opacity="0.35"/>
      <circle cx="45" cy="59" r="7" fill="#69d19d"/>
      <path d="M41.5 59 L44 61.5 L48.5 56.5" fill="none" stroke="#0b0d1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="63" font-size="10.5" fill="#fff7ed">empty input</text>
      <text x="230" y="63" font-size="9" font-weight="700" fill="#69d19d" text-anchor="end">PASS</text>
    </g>
    <g>
      <rect x="28" y="82" width="212" height="30" rx="9" fill="#69d19d" fill-opacity="0.07" stroke="#69d19d" stroke-opacity="0.35"/>
      <circle cx="45" cy="97" r="7" fill="#69d19d"/>
      <path d="M41.5 97 L44 99.5 L48.5 94.5" fill="none" stroke="#0b0d1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="101" font-size="10.5" fill="#fff7ed">unicode names</text>
      <text x="230" y="101" font-size="9" font-weight="700" fill="#69d19d" text-anchor="end">PASS</text>
    </g>
    <g>
      <rect x="28" y="120" width="212" height="30" rx="9" fill="#ff6f73" fill-opacity="0.1" stroke="#ff6f73" stroke-opacity="0.6"/>
      <circle cx="45" cy="135" r="7" fill="#ff6f73"/>
      <path d="M42 132 L48 138 M48 132 L42 138" fill="none" stroke="#0b0d1c" stroke-width="1.8" stroke-linecap="round"/>
      <text x="60" y="139" font-size="10.5" fill="#fff7ed">max boundary</text>
      <text x="230" y="139" font-size="9" font-weight="700" fill="#ff6f73" text-anchor="end">FAIL</text>
    </g>
    <g>
      <rect x="28" y="158" width="212" height="30" rx="9" fill="#69d19d" fill-opacity="0.07" stroke="#69d19d" stroke-opacity="0.35"/>
      <circle cx="45" cy="173" r="7" fill="#69d19d"/>
      <path d="M41.5 173 L44 175.5 L48.5 170.5" fill="none" stroke="#0b0d1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="177" font-size="10.5" fill="#fff7ed">negative values</text>
      <text x="230" y="177" font-size="9" font-weight="700" fill="#69d19d" text-anchor="end">PASS</text>
    </g>

    <text x="28" y="206" font-size="9" fill="#d8c8b8">3 passed · <tspan fill="#ff6f73">1 failed</tspan></text>

    <!-- coverage donut: r=50, circumference 314.16, 75% = 235.62 -->
    <circle cx="312" cy="112" r="50" fill="none" stroke="#d8c8b8" stroke-opacity="0.1" stroke-width="16"/>
    <circle cx="312" cy="112" r="50" fill="none" stroke="#69d19d" stroke-width="16" stroke-dasharray="235.62 314.16" transform="rotate(-90 312 112)"/>
    <circle cx="312" cy="112" r="61" fill="none" stroke="#ffb15f" stroke-opacity="0.18"/>
    <text x="312" y="117" font-size="22" font-weight="700" fill="#fff7ed" text-anchor="middle">75%</text>
    <text x="312" y="133" font-size="9" fill="#9f948d" text-anchor="middle" letter-spacing="1">COVERAGE</text>
  </g>
</svg>
