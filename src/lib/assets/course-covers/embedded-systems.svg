<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225" role="img" aria-label="Microcontroller chip wired to four sensors over I2C, SPI, UART and ADC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1c"/>
      <stop offset="1" stop-color="#181a2d"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="224" rx="18" fill="url(#bg)" stroke="#ffb15f" stroke-opacity="0.18"/>

  <!-- bus traces -->
  <g fill="none" stroke="#ffb15f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M170 57 V44 H96"/>
    <path d="M230 57 V44 H304"/>
    <path d="M170 167 V181 H96"/>
    <path d="M230 167 V181 H304"/>
  </g>
  <g fill="none" stroke="#ffb15f" stroke-opacity="0.35" stroke-width="1.2">
    <path d="M145 112 H118"/>
    <path d="M255 112 H282"/>
  </g>
  <g fill="#ffb15f">
    <circle cx="170" cy="44" r="3"/>
    <circle cx="230" cy="44" r="3"/>
    <circle cx="170" cy="181" r="3"/>
    <circle cx="230" cy="181" r="3"/>
    <circle cx="118" cy="112" r="2.5" fill-opacity="0.5"/>
    <circle cx="282" cy="112" r="2.5" fill-opacity="0.5"/>
  </g>

  <!-- pin legs -->
  <g fill="#9f948d">
    <rect x="164" y="57" width="6" height="10" rx="1"/><rect x="179" y="57" width="6" height="10" rx="1"/><rect x="194" y="57" width="6" height="10" rx="1"/><rect x="209" y="57" width="6" height="10" rx="1"/><rect x="224" y="57" width="6" height="10" rx="1"/>
    <rect x="164" y="157" width="6" height="10" rx="1"/><rect x="179" y="157" width="6" height="10" rx="1"/><rect x="194" y="157" width="6" height="10" rx="1"/><rect x="209" y="157" width="6" height="10" rx="1"/><rect x="224" y="157" width="6" height="10" rx="1"/>
    <rect x="145" y="79" width="10" height="6" rx="1"/><rect x="145" y="94" width="10" height="6" rx="1"/><rect x="145" y="109" width="10" height="6" rx="1"/><rect x="145" y="124" width="10" height="6" rx="1"/><rect x="145" y="139" width="10" height="6" rx="1"/>
    <rect x="245" y="79" width="10" height="6" rx="1"/><rect x="245" y="94" width="10" height="6" rx="1"/><rect x="245" y="109" width="10" height="6" rx="1"/><rect x="245" y="124" width="10" height="6" rx="1"/><rect x="245" y="139" width="10" height="6" rx="1"/>
  </g>

  <!-- chip body -->
  <rect x="155" y="67" width="90" height="90" rx="8" fill="#181a2d" stroke="#ffb15f" stroke-width="2"/>
  <rect x="165" y="77" width="70" height="70" rx="4" fill="#ffb15f" fill-opacity="0.07" stroke="#ffb15f" stroke-opacity="0.25"/>
  <circle cx="167" cy="79" r="3" fill="#ffb15f"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="200" y="115" font-size="16" font-weight="700" fill="#fff7ed">MCU</text>
    <text x="200" y="130" font-size="8" fill="#9f948d">32K RAM</text>

    <!-- bus labels -->
    <g font-size="9" font-weight="700" fill="#ffb15f">
      <text x="133" y="38">I2C</text>
      <text x="267" y="38">SPI</text>
      <text x="133" y="197">UART</text>
      <text x="267" y="197">ADC</text>
    </g>

    <!-- sensor nodes -->
    <g font-size="10" font-weight="700">
      <rect x="30" y="30" width="66" height="28" rx="9" fill="#69d19d" fill-opacity="0.1" stroke="#69d19d" stroke-opacity="0.6"/>
      <circle cx="42" cy="44" r="3" fill="#69d19d"/>
      <text x="67" y="48" fill="#fff7ed">TEMP</text>
      <rect x="304" y="30" width="66" height="28" rx="9" fill="#69d19d" fill-opacity="0.1" stroke="#69d19d" stroke-opacity="0.6"/>
      <circle cx="316" cy="44" r="3" fill="#69d19d"/>
      <text x="341" y="48" fill="#fff7ed">FLASH</text>
      <rect x="30" y="167" width="66" height="28" rx="9" fill="#69d19d" fill-opacity="0.1" stroke="#69d19d" stroke-opacity="0.6"/>
      <circle cx="42" cy="181" r="3" fill="#69d19d"/>
      <text x="67" y="185" fill="#fff7ed">GPS</text>
      <rect x="304" y="167" width="66" height="28" rx="9" fill="#69d19d" fill-opacity="0.1" stroke="#69d19d" stroke-opacity="0.6"/>
      <circle cx="316" cy="181" r="3" fill="#69d19d"/>
      <text x="341" y="185" fill="#fff7ed">LIGHT</text>
    </g>
  </g>
</svg>
