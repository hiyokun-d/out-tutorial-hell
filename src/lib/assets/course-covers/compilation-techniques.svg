<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225" role="img" aria-label="Source code split into tokens feeding a parse tree">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1c"/>
      <stop offset="1" stop-color="#181a2d"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ffb15f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="224" rx="18" fill="url(#bg)" stroke="#ffb15f" stroke-opacity="0.18"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- source line -->
    <text x="24" y="36" font-size="10" fill="#9f948d">1</text>
    <text x="200" y="38" font-size="16" font-weight="700" fill="#fff7ed" text-anchor="middle">count = count + 1;</text>

    <!-- token pills -->
    <g font-size="11" font-weight="700" text-anchor="middle">
      <rect x="80" y="52" width="52" height="22" rx="11" fill="#ffb15f" fill-opacity="0.14" stroke="#ffb15f" stroke-opacity="0.6"/>
      <text x="106" y="67" fill="#ffb15f">count</text>
      <rect x="140" y="52" width="24" height="22" rx="11" fill="#d8c8b8" fill-opacity="0.08" stroke="#d8c8b8" stroke-opacity="0.45"/>
      <text x="152" y="67" fill="#fff7ed">=</text>
      <rect x="172" y="52" width="52" height="22" rx="11" fill="#ffb15f" fill-opacity="0.14" stroke="#ffb15f" stroke-opacity="0.6"/>
      <text x="198" y="67" fill="#ffb15f">count</text>
      <rect x="232" y="52" width="24" height="22" rx="11" fill="#d8c8b8" fill-opacity="0.08" stroke="#d8c8b8" stroke-opacity="0.45"/>
      <text x="244" y="67" fill="#fff7ed">+</text>
      <rect x="264" y="52" width="24" height="22" rx="11" fill="#69d19d" fill-opacity="0.12" stroke="#69d19d" stroke-opacity="0.55"/>
      <text x="276" y="67" fill="#69d19d">1</text>
      <rect x="296" y="52" width="24" height="22" rx="11" fill="#d8c8b8" fill-opacity="0.08" stroke="#d8c8b8" stroke-opacity="0.45"/>
      <text x="308" y="67" fill="#fff7ed">;</text>
    </g>

    <!-- token type labels -->
    <g font-size="8" fill="#9f948d" text-anchor="middle" letter-spacing="0.5">
      <text x="106" y="86">ID</text>
      <text x="152" y="86">OP</text>
      <text x="198" y="86">ID</text>
      <text x="244" y="86">OP</text>
      <text x="276" y="86">NUM</text>
      <text x="308" y="86">END</text>
    </g>

    <!-- arrows into tree -->
    <g stroke="#ffb15f" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#head)">
      <path d="M130 92 Q160 98 184 108"/>
      <path d="M200 92 L200 106"/>
      <path d="M270 92 Q240 98 216 108"/>
    </g>

    <!-- parse tree edges -->
    <g stroke="#9f948d" stroke-width="1.4" fill="none">
      <path d="M200 132 L144 150"/>
      <path d="M200 132 L256 150"/>
      <path d="M256 172 L222 188"/>
      <path d="M256 172 L290 188"/>
    </g>

    <!-- parse tree nodes -->
    <g font-size="11" font-weight="700" text-anchor="middle">
      <rect x="183" y="112" width="34" height="22" rx="7" fill="#ffb15f" fill-opacity="0.2" stroke="#ffb15f"/>
      <text x="200" y="127" fill="#fff7ed">=</text>
      <rect x="116" y="150" width="56" height="22" rx="7" fill="#181a2d" stroke="#d8c8b8" stroke-opacity="0.6"/>
      <text x="144" y="165" fill="#ffb15f">count</text>
      <rect x="239" y="150" width="34" height="22" rx="7" fill="#ffb15f" fill-opacity="0.2" stroke="#ffb15f"/>
      <text x="256" y="165" fill="#fff7ed">+</text>
      <rect x="194" y="188" width="56" height="22" rx="7" fill="#181a2d" stroke="#d8c8b8" stroke-opacity="0.6"/>
      <text x="222" y="203" fill="#ffb15f">count</text>
      <rect x="273" y="188" width="34" height="22" rx="7" fill="#181a2d" stroke="#69d19d" stroke-opacity="0.7"/>
      <text x="290" y="203" fill="#69d19d">1</text>
    </g>

    <text x="24" y="203" font-size="9" fill="#9f948d" letter-spacing="1">LEX → PARSE</text>
  </g>
</svg>
