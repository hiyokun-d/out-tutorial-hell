<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225" role="img" aria-label="Fetch-execute cycle ring being hit by an interrupt signal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1c"/>
      <stop offset="1" stop-color="#181a2d"/>
    </linearGradient>
    <marker id="ring-head" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ffb15f"/>
    </marker>
    <marker id="irq-head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ff6f73"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="224" rx="18" fill="url(#bg)" stroke="#ffb15f" stroke-opacity="0.18"/>

  <!-- fetch-execute ring -->
  <circle cx="112" cy="112" r="66" fill="#ffb15f" fill-opacity="0.05"/>
  <circle cx="112" cy="112" r="66" fill="none" stroke="#ffb15f" stroke-width="2.5" stroke-dasharray="10 7" stroke-linecap="round"/>
  <!-- direction arrows (clockwise) -->
  <g fill="none" stroke="none">
    <path d="M150 58 A66 66 0 0 1 160 67" marker-end="url(#ring-head)"/>
    <path d="M74 166 A66 66 0 0 1 64 157" marker-end="url(#ring-head)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="700">
    <circle cx="112" cy="46" r="5" fill="#ffb15f"/>
    <circle cx="112" cy="178" r="5" fill="#ffb15f"/>
    <circle cx="46" cy="112" r="5" fill="#ffb15f"/>
    <text x="112" y="68" font-size="10" fill="#fff7ed">FETCH</text>
    <text x="112" y="164" font-size="10" fill="#fff7ed">EXECUTE</text>
    <text x="74" y="116" font-size="10" fill="#d8c8b8">DECODE</text>
    <text x="118" y="110" font-size="13" fill="#ffb15f">CPU</text>
    <text x="118" y="124" font-size="8" fill="#9f948d" font-weight="400">cycle</text>
  </g>

  <!-- impact point -->
  <circle cx="178" cy="112" r="11" fill="#ff6f73" fill-opacity="0.18"/>
  <path d="M178 98 L181 108 L191 105 L184 113 L192 120 L181 118 L178 127 L175 118 L165 120 L172 113 L165 105 L175 108 Z" fill="#ff6f73"/>

  <!-- interrupt waveform -->
  <polyline points="386,112 350,112 342,112 336,72 328,152 320,58 311,164 303,86 296,134 289,112 258,112 250,112 245,92 240,130 235,112 196,112"
            fill="none" stroke="#ff6f73" stroke-opacity="0.16" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="386,112 350,112 342,112 336,72 328,152 320,58 311,164 303,86 296,134 289,112 258,112 250,112 245,92 240,130 235,112 196,112"
            fill="none" stroke="#ff6f73" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#irq-head)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="300" y="28" width="72" height="20" rx="10" fill="#ff6f73" fill-opacity="0.14" stroke="#ff6f73" stroke-opacity="0.6"/>
    <text x="336" y="42" font-size="10" font-weight="700" fill="#ff6f73" text-anchor="middle">IRQ 0x20</text>
    <text x="376" y="196" font-size="9" fill="#9f948d" text-anchor="end" letter-spacing="0.5">SAVE · VECTOR · HANDLE · RESTORE</text>
  </g>
</svg>
